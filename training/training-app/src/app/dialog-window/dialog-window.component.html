<div class="dialog-container">
  <h2 mat-dialog-title class="dialog-header">
    <mat-icon color="warn">warning</mat-icon>
    <span>Confirm Deletion</span>
  </h2>

  <mat-dialog-content class="mat-typography">
    <p>{{data.text}}</p>
    <p class="sub-text">This action cannot be undone and all associated data will be removed.</p>
  </mat-dialog-content>

  <mat-dialog-actions class="action-buttons" align="end">
    <button mat-flat-button (click)="onConfirm()">
      <mat-icon>checkmark</mat-icon>
      Confirm
    </button>
    <button mat-button (click)="onCancel()" color="warn">
      <mat-icon>close</mat-icon>
      Cancel
    </button>
  </mat-dialog-actions>
</div>
